[project]
name = "medlearn-assistant"
version = "0.1.0"
description = "AI-Powered Medical Education RAG System"
readme = "README.md"

# Project is pinned to Python 3.12
requires-python = ">=3.12,<3.13"

dependencies = [
    # ============================================================
    # Web Framework
    # ============================================================
    "fastapi==0.121.0",
    "uvicorn[standard]==0.38.0",
    "starlette>=0.40.0,<0.50.0",
    "python-multipart==0.0.20",
    # ============================================================
    # Configuration & Validation
    # ============================================================
    "python-dotenv==1.2.1",
    "pydantic==2.12.4",
    "pydantic-settings>=2.0.0",
    # ============================================================
    # HTTP / External APIs
    # ============================================================
    "requests==2.32.5",
    "httpx>=0.27.0",
    "huggingface-hub>=0.34.0,<2",
    # ============================================================
    # LlamaIndex Core
    # ============================================================
    # Use llama-index-core instead of the full llama-index
    # meta-package to avoid unnecessary LlamaCloud dependencies.
    "llama-index-core>=0.14.3,<0.15",
    # Azure OpenAI
    "llama-index-llms-azure-openai==0.4.2",
    "llama-index-embeddings-azure-openai==0.4.1",
    # Multimodal Azure OpenAI
    "llama-index-multi-modal-llms-azure-openai==0.5.1",
    # SQL / Database Reader
    "llama-index-readers-database==0.5.1",
    # PostgreSQL Vector Store
    "llama-index-vector-stores-postgres==0.7.1",
    # ============================================================
    # Retrieval - Vector + BM25 + Fusion
    # ============================================================
    "llama-index-retrievers-bm25>=0.7.1,<0.8",
    # ============================================================
    # MCP / External Tools
    # ============================================================
    "llama-index-tools-mcp>=0.4.0,<0.5",
    "mcp>=1.24.0,<2",
    # ============================================================
    # LlamaParse
    # Used for PDF / legacy DOC parsing
    # ============================================================
    "llama-parse==0.6.83",
    # ============================================================
    # OpenAI
    # Keep OpenAI 1.x for this dependency stack
    # ============================================================
    "openai>=1.81.0,<2.0.0",
    # ============================================================
    # LangChain / PostgreSQL
    # ============================================================
    "langchain-postgres==0.0.16",
    # ============================================================
    # Langfuse - Evaluation / Observability
    # ============================================================
    "langfuse==3.9.1",
    # ============================================================
    # PostgreSQL / pgvector
    # ============================================================
    "sqlalchemy>=2.0.45",
    "psycopg2-binary==2.9.11",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.2.0",
    # ============================================================
    # Multi-format Document Processing
    # ============================================================
    # PDF
    "pypdf==6.2.0",
    "pymupdf==1.24.0",
    # HTML
    "beautifulsoup4==4.14.2",
    # DOCX
    "python-docx>=1.1.2,<2",
    # XLSX
    "openpyxl>=3.1.5,<4",
    # TXT uses Python built-in file handling
    # ============================================================
    # Guardrails / PII Detection
    # ============================================================
    # 0.11.0 requires OpenAI 2.x, so use 0.10.2 with OpenAI 1.x.
    "guardrails-ai==0.10.2",
    "guardrails-ai-detect-pii==0.0.6",
    # ============================================================
    # Authentication
    # ============================================================
    "python-jose[cryptography]>=3.3.0",
    # ============================================================
    # Utilities
    # ============================================================
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pylint>=4.0.8",
    "detectpii>=0.1.8",
]


# ================================================================
# Development Dependencies
# ================================================================

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]


# ================================================================
# UV Configuration
# ================================================================

[tool.uv]
package = false


# ================================================================
# Pytest Configuration
# ================================================================

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
asyncio_mode = "auto"
cache_dir = ".test-cache"
verbosity_test_cases = 1
filterwarnings = [
    'ignore:This package \(llama-cloud-services\) is deprecated.*:DeprecationWarning:llama_parse',
    "ignore:The 'is_flag' and 'flag_value' parameters are not supported by Typer.*:DeprecationWarning:typer.params",
]

[tool.coverage.report]
fail_under = 80
show_missing = false
